# Дополнительные описания AVRDUDE для микроконтроллеров,
# которых нет в штатном Tools/AVRDUDE/avrdude.conf.
#
# Этот файл загружается после штатной конфигурации AVRDUDE.
# Для добавления нового МК:
# 1. Добавьте профиль в devices.json с его реальной сигнатурой.
# 2. Если AVRDUDE не знает указанный avrdudePart, добавьте сюда
#    корректное описание part в синтаксисе AVRDUDE.
# 3. Убедитесь, что описание содержит правильные параметры ISP,
#    Flash, EEPROM, страниц, задержек и алгоритмов записи.
#
# Не копируйте профиль похожего МК без сверки с документацией.
