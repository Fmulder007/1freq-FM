name: Build 1Freq-FM7 Programmer bundle

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-1freq-fm7-programmer.yml"
      - "Code/1freq-FM7/Programmer/**"
      - "Code/1freq-FM7/Console/Firmware/ATmega328P.hex"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and unpack portable TDM-GCC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $programmer = Join-Path $env:GITHUB_WORKSPACE "Code/1freq-FM7/Programmer"
          $stage = Join-Path $env:RUNNER_TEMP "tdm-stage"
          $toolchain = Join-Path $programmer "toolchain"
          $installer = Join-Path $env:RUNNER_TEMP "tdm64-gcc-10.3.0-2.exe"
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip/7z.exe"

          if (!(Test-Path $sevenZip)) {
            throw "7-Zip was not found on the Windows runner."
          }

          New-Item -ItemType Directory -Force -Path $stage, $toolchain | Out-Null
          Invoke-WebRequest -Uri "https://github.com/jmeubank/tdm-gcc/releases/download/v10.3.0-tdm64-2/tdm64-gcc-10.3.0-2.exe" -OutFile $installer

          & $sevenZip e $installer "-o$stage" -y
          if ($LASTEXITCODE -gt 1) { throw "Could not unpack TDM-GCC installer (7-Zip exit $LASTEXITCODE)." }

          $xzFiles = Get-ChildItem -Path $stage -Filter "*.tar.xz"
          if (!$xzFiles) { throw "TDM-GCC installer did not contain its component archives." }

          foreach ($xz in $xzFiles) {
            & $sevenZip e $xz.FullName "-o$stage" -y
            if ($LASTEXITCODE -gt 1) { throw "Could not unpack $($xz.Name)." }
          }

          $tarFiles = Get-ChildItem -Path $stage -Filter "*.tar"
          if (!$tarFiles) { throw "TDM-GCC component TAR archives were not extracted." }

          foreach ($tar in $tarFiles) {
            & $sevenZip x $tar.FullName "-o$toolchain" -y
            if ($LASTEXITCODE -gt 1) { throw "Could not install $($tar.Name) into the portable toolchain." }
          }

          $gcc = Join-Path $toolchain "bin/gcc.exe"
          if (!(Test-Path $gcc)) {
            Get-ChildItem -Path $toolchain -Filter "gcc.exe" -Recurse | Select-Object -First 10 -ExpandProperty FullName | Write-Host
            throw "Expected portable compiler toolchain/bin/gcc.exe was not created."
          }

          & $gcc --version
          if ($LASTEXITCODE -ne 0) { throw "The unpacked GCC compiler cannot be started." }

          $target = (& $gcc -dumpmachine).Trim()
          Write-Host "TDM-GCC target: $target"
          if ($target -ne "x86_64-w64-mingw32") {
            throw "Unexpected TDM-GCC target: $target"
          }

          $licenseFiles = Get-ChildItem -Path $toolchain -Filter "COPYING*" -Recurse -File
          Write-Host "Included TDM license files: $($licenseFiles.Count)"
          Set-Content -Path (Join-Path $toolchain "README-TDM-GCC.txt") -Value @"
          TDM-GCC 10.3.0 TDM64 / MinGW-w64
          Official source: https://jmeubank.github.io/tdm-gcc/
          Release: https://github.com/jmeubank/tdm-gcc/releases/tag/v10.3.0-tdm64-2
          This compiler is invoked with -m32 by build-xp-x86.cmd.
          "@

      - name: Select and prepare XP-compatible AVRDUDE x86
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $programmer = Join-Path $env:GITHUB_WORKSPACE "Code/1freq-FM7/Programmer"
          $objdump = Join-Path $programmer "toolchain/bin/objdump.exe"
          $variants = @(
            @{
              Name = "AVRDUDE 7.3 MinGW x86"
              Url  = "https://github.com/avrdudes/avrdude/releases/download/v7.3/avrdude-v7.3-windows_mingw-x86.zip"
            },
            @{
              Name = "AVRDUDE 7.3 Arduino MinGW32"
              Url  = "https://github.com/avrdudes/avrdude/releases/download/v7.3/avrdude-v7.3-arduino_mingw32.zip"
            },
            @{
              Name = "AVRDUDE 7.1 Windows x86 (XP fallback)"
              Url  = "https://github.com/mariusgreuel/avrdude/releases/download/v7.1-windows/avrdude-v7.1-windows-windows-x86.zip"
            },
            @{
              Name = "AVRDUDE 6.3.1.1 Windows (XP fallback)"
              Url  = "https://github.com/mariusgreuel/avrdude/releases/download/v6.3.1.1-windows/avrdude-v6.3.1.1-windows.zip"
            },
            @{
              Name = "AVRDUDE 6.3.0 Arduino 32-bit Windows (XP fallback)"
              Url  = "https://downloads.arduino.cc/tools/avrdude-6.3.0-arduino17-i686-w64-mingw32.zip"
            }
          )

          $selected = $null
          foreach ($variant in $variants) {
            $zip = Join-Path $env:RUNNER_TEMP (($variant.Name -replace '[^A-Za-z0-9]+','-') + ".zip")
            $extract = Join-Path $env:RUNNER_TEMP (($variant.Name -replace '[^A-Za-z0-9]+','-') + "-extract")
            if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
            New-Item -ItemType Directory -Force -Path $extract | Out-Null

            Write-Host "Checking $($variant.Name)"
            Invoke-WebRequest -Uri $variant.Url -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force

            $exe = Get-ChildItem -Path $extract -Filter "avrdude.exe" -Recurse | Select-Object -First 1
            $conf = Get-ChildItem -Path $extract -Filter "avrdude.conf" -Recurse | Select-Object -First 1
            if (!$exe -or !$conf) {
              Write-Host "Rejected: executable or configuration file missing."
              continue
            }

            $fileInfo = & $objdump -f $exe.FullName | Out-String
            $headers = & $objdump -p $exe.FullName | Out-String
            if ($LASTEXITCODE -ne 0 -or $fileInfo -notmatch "pei-i386") {
              Write-Host "Rejected: not a valid PE32 x86 executable."
              continue
            }

            $majorMatch = [regex]::Match($headers, "MajorSubsystemVersion\s+(\d+)")
            $minorMatch = [regex]::Match($headers, "MinorSubsystemVersion\s+(\d+)")
            if (!$majorMatch.Success -or !$minorMatch.Success) {
              Write-Host "Rejected: subsystem version could not be read."
              continue
            }
            $major = [int]$majorMatch.Groups[1].Value
            $minor = [int]$minorMatch.Groups[1].Value
            if ($major -gt 5 -or ($major -eq 5 -and $minor -gt 1)) {
              Write-Host "Rejected: Windows subsystem $major.$minor is newer than XP 5.01."
              continue
            }

            if ($headers -match "(?i)DLL Name:\s*(WINUSB\.DLL|API-MS-WIN-[^\s]+)") {
              Write-Host "Rejected: statically imports a DLL/API set unavailable on Windows XP."
              continue
            }
            $postXpPattern = "(?i)\b(GetTickCount64|InitializeCriticalSectionEx|GetSystemTimePreciseAsFileTime|GetFileInformationByHandleEx|GetFinalPathNameByHandleW|CancelIoEx|GetUserDefaultLocaleName|GetLocaleInfoEx|SetThreadErrorMode|GetThreadId|AddDllDirectory)\b"
            $postXpMatches = [regex]::Matches($headers, $postXpPattern) |
              ForEach-Object { $_.Value } | Sort-Object -Unique
            if ($postXpMatches) {
              Write-Host "Rejected: these post-XP symbols appear in the PE import table: $($postXpMatches -join ', ')"
              continue
            }

            $help = & $exe.FullName -? 2>&1 | Out-String
            if ($help -notmatch "(?i)avrdude") {
              Write-Host "Rejected: executable did not start correctly on the build host."
              continue
            }

            $selected = @{
              Name = $variant.Name
              Extract = $extract
              Exe = $exe.FullName
              Conf = $conf.FullName
              Major = $major
              Minor = $minor
            }
            break
          }

          if (!$selected) {
            throw "Neither AVRDUDE 7.3 MinGW x86 distribution passed the XP PE/API checks. No incompatible executable will be packaged."
          }

          Copy-Item -LiteralPath $selected.Exe -Destination (Join-Path $programmer "avrdude.exe") -Force
          Copy-Item -LiteralPath $selected.Conf -Destination (Join-Path $programmer "avrdude.conf") -Force
          Get-ChildItem -Path $selected.Extract -Filter "*.dll" -Recurse -File | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $programmer $_.Name) -Force
          }
          Set-Content -Path (Join-Path $programmer "avrdude-build-info.txt") -Value @"
          $($selected.Name)
          Windows subsystem: $($selected.Major).$($selected.Minor)
          Selected after checking PE32 x86 architecture, Windows XP subsystem level,
          static imports, and successful startup on the Windows build host.
          "@

          Write-Host "Selected: $($selected.Name)"
          Write-Host "AVRDUDE subsystem: $($selected.Major).$($selected.Minor)"
          Write-Host "Bundled AVRDUDE DLL count: $((Get-ChildItem $programmer -Filter '*.dll' -File).Count)"

      - name: Build and verify 32-bit XP-targeted program
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $programmer = Join-Path $env:GITHUB_WORKSPACE "Code/1freq-FM7/Programmer"
          Push-Location $programmer
          try {
            & cmd.exe /c 'build-xp-x86.cmd --no-pause'
            if ($LASTEXITCODE -ne 0) { throw "build-xp-x86.cmd failed with exit code $LASTEXITCODE." }

            & .\1Freq-FM7-Programmer.exe --self-test
            if ($LASTEXITCODE -ne 0) { throw "Programmer self-test failed with exit code $LASTEXITCODE." }

            $objdump = Join-Path $programmer "toolchain/bin/objdump.exe"
            $headers = & $objdump -p (Join-Path $programmer "1Freq-FM7-Programmer.exe") | Out-String
            if ($headers -notmatch "pei-i386") { throw "The output EXE is not 32-bit x86." }
            if ($headers -notmatch "MajorSubsystemVersion\s+5" -or $headers -notmatch "MinorSubsystemVersion\s+1") {
              throw "The output EXE does not declare Windows subsystem version 5.01."
            }
            Write-Host "Verified: PE32 x86, Windows console subsystem 5.01."
          }
          finally {
            Pop-Location
          }

      - name: Create flat portable runtime package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $programmer = Join-Path $env:GITHUB_WORKSPACE "Code/1freq-FM7/Programmer"
          Push-Location $programmer
          try {
            & cmd.exe /c 'package.cmd --no-pause'
            if ($LASTEXITCODE -ne 0) { throw "package.cmd failed with exit code $LASTEXITCODE." }
          }
          finally {
            Pop-Location
          }

      - name: Upload complete bundle with source and adjacent GCC
        uses: actions/upload-artifact@v4
        with:
          name: 1Freq-FM7-Programmer-Full
          path: Code/1freq-FM7/Programmer/
          if-no-files-found: error
          retention-days: 30

      - name: Upload flat application package
        uses: actions/upload-artifact@v4
        with:
          name: 1Freq-FM7-Programmer-Portable
          path: Code/1freq-FM7/Programmer/dist/1Freq-FM7-Programmer/
          if-no-files-found: error
          retention-days: 30
